<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BS Room Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #12161e;
      --surface2: #1a2030;
      --accent: #f4c842;
      --accent2: #e8763a;
      --text: #e8eaf0;
      --muted: #6b7280;
      --error: #ef4444;
      --success: #22c55e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(244,200,66,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244,200,66,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeDown 0.6s ease both;
    }

    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      display: block;
      font-size: 14px;
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      -webkit-text-fill-color: var(--muted);
      color: var(--muted);
      margin-top: 4px;
    }

    .credits {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .credits a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid rgba(244,200,66,0.12);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      animation: fadeUp 0.6s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.1s; }

    label {
      display: block;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      background: var(--surface2);
      border: 1.5px solid rgba(244,200,66,0.15);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      text-transform: uppercase;
    }

    input::placeholder { color: var(--muted); font-size: 18px; letter-spacing: 1px; }
    input:focus { border-color: var(--accent); }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #0a0c10;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 1px;
      padding: 14px 20px;
      text-transform: uppercase;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }

    /* Count selector */
    .count-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .count-btn {
      background: var(--surface2);
      border: 1.5px solid rgba(244,200,66,0.15);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 14px;
      transition: all 0.2s;
    }

    .count-btn.active {
      background: rgba(244,200,66,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Info row */
    .info-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .info-box {
      flex: 1;
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .info-box .info-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-box .info-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
    }

    /* Error */
    .error-msg {
      color: var(--error);
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* Results */
    .results-card {
      display: none;
      animation: fadeUp 0.4s ease both;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .copy-all-btn {
      background: rgba(244,200,66,0.1);
      border: 1px solid rgba(244,200,66,0.3);
      border-radius: 8px;
      color: var(--accent);
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 12px;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    .copy-all-btn:hover { background: rgba(244,200,66,0.18); }

    .code-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .code-list::-webkit-scrollbar { width: 4px; }
    .code-list::-webkit-scrollbar-track { background: transparent; }
    .code-list::-webkit-scrollbar-thumb { background: rgba(244,200,66,0.2); border-radius: 2px; }

    .code-item {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border-radius: 10px;
      padding: 10px 14px;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
    }

    .code-item:hover { background: rgba(244,200,66,0.07); border-color: rgba(244,200,66,0.15); }
    .code-item.copied { border-color: var(--success); }

    .code-num {
      font-size: 11px;
      color: var(--muted);
      min-width: 22px;
      font-family: 'Barlow Condensed', sans-serif;
    }

    .code-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      flex: 1;
      color: var(--text);
    }

    .code-id {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
    }

    .copy-icon {
      font-size: 14px;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .code-item:hover .copy-icon { opacity: 1; }

    .copied-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--success);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 10px 20px;
      border-radius: 10px;
      transition: transform 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .copied-toast.show { transform: translateX(-50%) translateY(0); }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">
      BS Room Finder
      <span>Brawl Stars</span>
    </div>
    <div class="credits">credits: tiktok <a href="https://tiktok.com/@vankzdh" target="_blank">@vankzdh</a></div>
  </div>

  <div class="card">
    <label>Код комнаты</label>
    <div class="input-row">
      <input id="codeInput" type="text" placeholder="XPQR2Y8" maxlength="13" />
      <button onclick="generate()">Найти</button>
    </div>
    <div class="error-msg" id="errorMsg">Неверный код. Допустимые символы: QWERTYUPASDFGHJKLZCVBNM23456789</div>

    <div class="count-row">
      <div class="count-btn active" onclick="setCount(10, this)">10</div>
      <div class="count-btn" onclick="setCount(25, this)">25</div>
      <div class="count-btn" onclick="setCount(50, this)">50</div>
      <div class="count-btn" onclick="setCount(100, this)">100</div>
    </div>

    <div class="info-row" id="infoRow" style="display:none">
      <div class="info-box">
        <div class="info-label">Ваш код</div>
        <div class="info-val" id="infoCode">—</div>
      </div>
      <div class="info-box">
        <div class="info-label">ID</div>
        <div class="info-val" id="infoId">—</div>
      </div>
    </div>
  </div>

  <div class="card results-card" id="resultsCard">
    <div class="results-header">
      <div class="results-title">Следующие коды</div>
      <button class="copy-all-btn" onclick="copyAll()">Копировать все</button>
    </div>
    <div class="code-list" id="codeList"></div>
  </div>

</div>

<div class="copied-toast" id="toast">Скопировано!</div>

<script>
  const TEAM_CHARS = "QWERTYUPASDFGHJKLZCVBNM23456789";
  const TEAM_TAG   = "X";
  let countVal = 10;

  function setCount(n, el) {
    countVal = n;
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  // Точная копия toLong / toLongS / toId / toCode из LongToCodeConverter.java
  // BigInt используется для точной 64-битной арифметики

  function toLong(hiInt, loInt) {
    return (BigInt(hiInt) << 32n) | (BigInt(loInt) & 0xFFFFFFFFFn);
  }

  function toLongS(hiInt, loInt) {
    return (BigInt(hiInt) << 32n) | BigInt(loInt);
  }

  function toId(code) {
    code = code.toUpperCase();
    if (!code.startsWith(TEAM_TAG)) code = TEAM_TAG + code;
    if (code.length >= 14) return null;

    const body = code.substring(1);
    if (body.length === 0) return 0n;

    const len = BigInt(TEAM_CHARS.length);
    let i     = 0;
    let unk6  = 0n;
    let unk7  = 0n;
    let unk12 = 0n;

    do {
      const counter   = i + 1;
      const ch        = body[i];
      const subStrIdx = TEAM_CHARS.indexOf(ch);
      if (subStrIdx < 0) return null;

      const idx = BigInt(subStrIdx);
      unk12 = unk6 * len + idx;
      // Эмулируем 64-битный сдвиг вправо на 32
      const combined = toLong(Number(unk7 & 0xFFFFFFFFn), Number(unk6 & 0xFFFFFFFFn)) * len + idx;
      unk7  = combined >> 32n;
      unk6  = unk12;
      i     = counter;
    } while (i < body.length);

    // if ((unk12 & unk7) != -1)
    const check = (unk12 & unk7) & 0xFFFFFFFFFFFFFFFFn;
    if (check !== 0xFFFFFFFFFFFFFFFFn) {
      const v13  = toLongS(Number(unk7 & 0xFFFFFFFFn), Number(unk12 & 0xFFFFFFFFn)) >> 8n;
      const loInt = v13 & 0x7FFFFFFFn;
      const hiInt = unk6 & 0xFFn;
      return toLong(Number(hiInt), Number(loInt));
    }

    return null;
  }

  function convert(id) {
    const len = BigInt(TEAM_CHARS.length);
    let tag = '';
    while (id > 0n) {
      const charIndex = Number(id % len);
      tag = TEAM_CHARS[charIndex] + tag;
      id -= BigInt(charIndex);
      id /= len;
    }
    return tag;
  }

  function toCode(id) {
    const hiInt = Number(id >> 32n) & 0xFFFFFFFF;
    const loInt = Number(id & 0xFFFFFFFFn);
    if (hiInt >= 256) return null;
    const l = toLong(loInt >> 24, (hiInt | (loInt << 8)) & 0xFFFFFFFF);
    return TEAM_TAG + convert(l);
  }

  function generate() {
    const raw   = document.getElementById('codeInput').value.trim().toUpperCase();
    const input = raw.startsWith(TEAM_TAG) ? raw : TEAM_TAG + raw;
    const errEl = document.getElementById('errorMsg');

    errEl.style.display = 'none';

    const id = toId(input);
    if (id === null || id < 0n) {
      errEl.style.display = 'block';
      document.getElementById('resultsCard').style.display = 'none';
      document.getElementById('infoRow').style.display = 'none';
      return;
    }

    // Проверка roundtrip
    const check = toCode(id);

    document.getElementById('infoCode').textContent = check || input;
    document.getElementById('infoId').textContent   = id.toString();
    document.getElementById('infoRow').style.display = 'flex';

    const list = document.getElementById('codeList');
    list.innerHTML = '';

    for (let i = 1; i <= countVal; i++) {
      const nextId   = id + BigInt(i);
      const nextCode = toCode(nextId);
      if (!nextCode) continue;

      const item = document.createElement('div');
      item.className = 'code-item';
      item.innerHTML = `
        <span class="code-num">${i}</span>
        <span class="code-val">${nextCode}</span>
        <span class="code-id">${nextId}</span>
        <span class="copy-icon">⎘</span>
      `;
      item.onclick = () => copyCode(nextCode, item);
      list.appendChild(item);
    }

    const resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';
  }

  function copyCode(code, el) {
    navigator.clipboard.writeText(code).then(() => {
      el.classList.add('copied');
      setTimeout(() => el.classList.remove('copied'), 1200);
      showToast('Скопировано: ' + code);
    });
  }

  function copyAll() {
    const items = document.querySelectorAll('.code-val');
    const text  = Array.from(items).map(el => el.textContent).join('\n');
    navigator.clipboard.writeText(text).then(() => showToast('Все коды скопированы!'));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Enter для запуска
  document.getElementById('codeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') generate();
  });
</script>
</body>
</html>
